# cargo-deny policy: run `cargo deny check` on a provisioning machine.
[graph]
targets = ["wasm32-unknown-unknown", "x86_64-unknown-linux-gnu", "aarch64-unknown-linux-gnu"]

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
allow = ["MIT", "Apache-2.0", "BSD-3-Clause", "Unicode-3.0", "Unlicense"]

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Pure-Rust, offline, no entropy: these must never enter the graph.
deny = [
  { crate = "openssl" },
  { crate = "openssl-sys" },
  { crate = "ring" },
  { crate = "rustls" },
  { crate = "native-tls" },
  { crate = "getrandom" },
  { crate = "tokio" },
  { crate = "reqwest" },
  { crate = "hyper" },
  { crate = "wasm-bindgen" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
