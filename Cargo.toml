[package]
name = "tinysig"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Offline, WebAssembly-compatible verification of Trustbase CI Sigstore attestations"
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["sigstore", "trustbase", "wasm", "verification"]
categories = ["cryptography", "wasm"]

[dependencies]
base64 = { version = "0.22", default-features = false, features = ["alloc"] }
der = { version = "0.7", default-features = false, features = [
    "alloc",
    "derive",
    "oid",
] }
p256 = { version = "0.13", default-features = false, features = ["ecdsa"] }
p384 = { version = "0.13", default-features = false, features = ["ecdsa"] }
serde = { version = "1", default-features = false, features = [
    "derive",
    "alloc",
] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }
x509-cert = { version = "0.2", default-features = false }

[[example]]
name = "wasm_smoke"
crate-type = ["cdylib"]
test = false
